<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 开源项目涨星看板" />
    <title>AI Radar · 开源项目看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="AI Radar 首页">
          <span class="brand-mark">✦</span>
          <span>AI Radar</span>
        </a>
        <p class="subtitle">发现正在加速的 AI 开源项目</p>
        <div class="updated" id="updated">加载中…</div>
      </header>

      <section class="hero" aria-labelledby="headline">
        <div>
          <p class="eyebrow">WEEKLY OPEN SOURCE SIGNAL</p>
          <h1 id="headline">过去 7 天，<br /><em>哪些 AI 项目正在升温？</em></h1>
        </div>
        <div class="hero-note">
          <span class="pulse"></span>
          每日自动采集 GitHub 公开数据
        </div>
      </section>

      <section class="controls" aria-label="筛选项目">
        <div class="tabs" id="tabs" role="tablist"></div>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="搜索项目、标签或关键词" />
        </label>
      </section>

      <section class="summary" id="summary" aria-live="polite"></section>
      <section class="project-grid" id="projects" aria-label="项目列表"></section>
      <p class="empty" id="empty" hidden>没有找到匹配的项目，换个关键词试试。</p>

      <footer>
        <span>数据来自 GitHub 公开仓库</span>
        <span>·</span>
        <span>排序依据：近 7 天 Star 增量</span>
      </footer>
    </main>
    <template id="project-card">
      <article class="project-card">
        <div class="card-top">
          <span class="category"></span>
          <a class="repo-link" target="_blank" rel="noreferrer">查看仓库 <span>↗</span></a>
        </div>
        <h2></h2>
        <p class="description"></p>
        <div class="tags"></div>
        <div class="metrics">
          <div><span class="metric-label">近 7 天</span><strong class="growth"></strong></div>
          <div><span class="metric-label">总 Star</span><strong class="stars"></strong></div>
        </div>
      </article>
    </template>
    <script type="module" src="app.js"></script>
  </body>
</html>
