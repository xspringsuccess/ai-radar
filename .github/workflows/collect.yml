name: Collect AI project signals

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.mjs'
      - '.github/workflows/collect.yml'
  schedule:
    # 09:15 China Standard Time (UTC+8)
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/projects.json data/star-history.json
          git diff --staged --quiet || git commit -m "chore: refresh AI project signals"
          git pull --rebase origin main
          git push

